/* ---------- router and render ---------- */
function parse() {
  const h = location.hash.replace(/^#/, ''); if (!h) return { name: 'welcome' };
  if (['welcome', 'explore', 'practice', 'dashboard', 'profile', 'preferences'].indexOf(h) >= 0) return { name: h };
  let m;
  if ((m = h.match(/^cat-(.+)$/))) return { name: 'cat', id: m[1] };
  if ((m = h.match(/^sub-(.+)$/))) return { name: 'sub', id: m[1] };
  if ((m = h.match(/^lesson-(.+)-(\d+)$/))) return { name: 'lesson', id: m[1], i: +m[2] };
  if ((m = h.match(/^quiz-(.+)$/))) return { name: 'quiz', id: m[1] };
  if ((m = h.match(/^play-(.+)$/))) return { name: 'play', id: m[1] };
  if ((m = h.match(/^ex-(.+)-(\d+)$/))) return { name: 'ex', id: m[1], i: +m[2] };
  if (h === 'how') return { name: 'welcome' };
  return { name: 'welcome' };
}
function view() {
  switch (R.name) {
    case 'explore': return pageExplore(); case 'cat': return pageCategory(); case 'sub': return pageSub(); case 'lesson': return pageLesson();
    case 'quiz': return pageQuiz(); case 'play': return pagePlay(); case 'ex': return pageEx(); case 'practice': return pagePractice();
    case 'dashboard': return pageDash(); case 'profile': return pageProfile(); case 'preferences': return pagePrefs(); default: return pageWelcome();
  }
}
function draw(top) {
  const y = window.scrollY;
  app.innerHTML = chrome(view());
  window.scrollTo(0, top ? 0 : y);
}
function onRoute() {
  closeModal();
  const h = location.hash.replace(/^#/, '');
  R = parse();
  if (['quiz', 'ex'].indexOf(R.name) >= 0 && sub(R.id) && !isUnlocked(R.id)) { location.replace('#sub-' + R.id); return; }
  if (R.name === 'lesson' && sub(R.id) && !canOpenLesson(R.id, R.i)) { location.replace('#sub-' + R.id); return; }
  if (R.name === 'play') { const m = simById(R.id); if (m && !m.subs.some(isUnlocked)) { location.replace('#sub-' + m.subs[0]); return; } }
  if (R.name !== 'quiz') UI.qz = null;
  if (R.name !== 'play') UI.sm = null;
  if (R.name !== 'explore') UI.q = '';
  draw(h !== 'how');
  if (h === 'how') { const el = document.getElementById('how'); if (el) el.scrollIntoView(); }
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-a]'); if (!t || t.disabled) return;
  const a = t.dataset.a, v = t.dataset.v, i = t.dataset.i != null ? +t.dataset.i : null;
  switch (a) {
    case 'theme': S.theme = effTheme() === 'dark' ? 'light' : 'dark'; applyTheme(); save(); draw(); break;
    case 'setTheme': S.theme = v; applyTheme(); save(); draw(); break;
    case 'watch': watchAd(t.dataset.id); break;
    case 'adclose': if (adCtx) adCtx.onDismiss(); else closeModal(); break;
    case 'adok': if (adCtx && adCtx._ok) adCtx._ok(); break;
    case 'lvl': UI.lvl = v; draw(); break;
    case 'lpick': { const s = sub(R.id); UI.lc = { key: R.id + ':' + R.i, pick: i }; draw(); break; }
    case 'lcomplete': {
      const s = sub(R.id), key = R.id + ':' + R.i;
      if (!S.lessons[key]) { S.lessons[key] = Date.now(); log('lesson', s.lessons[R.i].t); award(20, 'Lesson complete'); afterAction([s.id]); }
      draw(); break;
    }
    case 'qstart': case 'qretry': qzStart(sub(R.id)); draw(true); break;
    case 'qpick': {
      const z = UI.qz, q = z.list[z.i].q; if (z.checked) break;
      if (q.type === 'multi') { const k = z.sel.indexOf(i); if (k >= 0) z.sel.splice(k, 1); else z.sel.push(i); }
      else { z.sel = [i]; qzCheck(); }
      draw(); break;
    }
    case 'qcheck': qzCheck(); draw(); break;
    case 'qnext': { const z = UI.qz; z.i++; z.sel = []; z.checked = false; if (z.i >= z.list.length) { qzFinish(); draw(true); } else draw(true); break; }
    case 'sstart': case 'sretry': simStart(simById(R.id)); draw(true); break;
    case 'spick': simPick(i); draw(); { const el = document.getElementById('last'); if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } break;
    case 'sresult': UI.sm.phase = 'result'; draw(true); break;
    case 'excomplete': {
      const s = sub(R.id), st = exState(R.id + ':' + R.i);
      if (!st.done && exReady(s, R.i)) { st.done = true; log('ex', e2(s, R.i)); award(15, 'Exercise complete'); afterAction([s.id]); }
      draw(); break;
    }
    case 'savename': S.name = $('#nm').value.trim().slice(0, 40); save(); toast('Name saved'); draw(); break;
    case 'export': $('#bk').value = JSON.stringify(S); break;
    case 'import': {
      try { const o = JSON.parse($('#bk').value); if (!o || typeof o !== 'object' || o.v !== 1) throw new Error('bad'); S = Object.assign(blank(), o); save(); applyTheme(); toast('Progress restored'); draw(); }
      catch (err) { toast('That backup text is not valid'); }
      break;
    }
    case 'lockall': S.unlock = {}; S.adp = {}; save(); toast('All sections locked'); draw(); break;
    case 'devunlock': SUBS.forEach(s => { if (!S.unlock[s.id]) S.unlock[s.id] = { t: Date.now(), provider: 'dev-bypass', real: false }; }); save(); toast('All sections unlocked (dev bypass)'); draw(); break;
    case 'reset': {
      if (t.dataset.armed !== '1') { t.dataset.armed = '1'; t.textContent = 'Press again to erase everything'; break; }
      S = blank(); save(); applyTheme(); UI.qz = null; UI.sm = null; UI.lc = null; toast('Progress erased'); draw(true); break;
    }
  }
});
function e2(s, i) { return s.ex[i].t; }
document.addEventListener('input', e => {
  if (e.target.id === 'q') { UI.q = e.target.value; const r = $('#results'); if (r) r.innerHTML = exploreResults(); }
  if (e.target.id === 'extext') { const st = exState(R.id + ':' + R.i); st.text = e.target.value; save(); syncEx(); }
});
document.addEventListener('change', e => {
  if (e.target.classList.contains('excheck')) { const st = exState(R.id + ':' + R.i); st.checks[+e.target.dataset.k] = e.target.checked; save(); syncEx(); }
});
function syncEx() { const b = $('#exbtn'); if (b) b.disabled = !exReady(sub(R.id), R.i); }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal')) { if (adCtx) adCtx.onDismiss(); else closeModal(); } });
window.addEventListener('hashchange', onRoute);
applyTheme();
onRoute();
})();

</script>
