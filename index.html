<style>
/* Layout concept: slim top bar (bottom tab bar on phones), one reading column, cards only for objects you can open. */
:root {
  --bg: #f5f6f8; --surface: #ffffff; --surface2: #edeff3; --line: #dbdfe6;
  --fg: #12161d; --muted: #556073;

  --f-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --gutter: 16px; --maxw: 1200px; --sec: 32px; --pad: 16px;
  --r: 16px; --shadow: 0 1px 2px rgba(18, 22, 29, .06), 0 6px 20px rgba(18, 22, 29, .05);
}
@media (prefers-color-scheme: dark) {

    --bg: #0d1118; --surface: #151a23; --surface2: #1d2431; --line: #2a3242;
    --fg: #e8ecf3; --muted: #99a4b8;
    --accent: #7f99ff; --accent-fg: #0a0f1f; --accent-soft: #1c2650;
    --gold: #f2b94b; --gold-soft: #2f2610;
    --good: #5fd08a; --good-soft: #112a1c; --bad: #ff8f86; --bad-soft: #35161a; --warn: #f0b15a; --warn-soft: #2e2212;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1118; --surface: #151a23; --surface2: #1d2431; --line: #2a3242;
  --fg: #e8ecf3; --muted: #99a4b8;
  --accent: #7f99ff; --accent-fg: #0a0f1f; --accent-soft: #1c2650;
  --gold: #f2b94b; --gold-soft: #2f2610;
  --good: #5fd08a; --good-soft: #112a1c; --bad: #ff8f86; --bad-soft: #35161a; --warn: #f0b15a; --warn-soft: #2e2212;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .25);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }

h1 { font-size: clamp(1.75rem, 1.25rem + 2.4vw, 2.75rem); font-weight: 700; }

button, input, textarea { font: inherit; color: inherit; }

.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.wrap { width: 100%; max-width: var(--maxw); margin-inline: auto; padding-left: max(var(--gutter), env(safe-area-inset-left, 0px)); padding-right: max(var(--gutter), env(safe-area-inset-right, 0px)); }
main.wrap { padding-block: calc(var(--sec) - 4px) calc(var(--sec) * 2); display: grid; gap: var(--sec); min-width: 0; align-content: start; }
.stack { display: grid; gap: 14px; min-width: 0; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.grid { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
.grid > * { min-width: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Top bar and tabs */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: color-mix(in srgb, var(--surface) 92%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 18px; min-height: 58px; }
.brand { font-family: var(--f-display); font-weight: 750; font-size: 1.25rem; color: var(--fg); letter-spacing: -.03em; display: flex; align-items: center; gap: 8px; }
.brand:hover { text-decoration: none; }
.brand i { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); display: inline-block; position: relative; }
.brand i::after { content: ""; position: absolute; left: 5px; top: 5px; width: 12px; height: 12px; border-left: 3px solid var(--accent-fg); border-bottom: 3px solid var(--accent-fg); transform: rotate(-45deg) scale(.7); }
.nav { display: none; gap: 4px; margin-left: 8px; }
.nav a, .tabs a { color: var(--muted); font-weight: 600; font-size: .94rem; }
.nav a { padding: 8px 12px; border-radius: 8px; }
.nav a:hover { background: var(--surface2); text-decoration: none; }
.nav a[aria-current], .tabs a[aria-current] { color: var(--accent); }
.nav a[aria-current] { background: var(--accent-soft); }
.spacer { flex: 1; }
.xpchip { font: 600 .82rem var(--f-mono); color: var(--gold); background: var(--gold-soft); padding: 5px 10px; border-radius: 99px; white-space: nowrap; }
.iconbtn { background: none; border: 1px solid var(--line); border-radius: 10px; width: 44px; height: 44px; flex: none; display: grid; place-items: center; cursor: pointer; color: var(--fg); }
.iconbtn:hover { background: var(--surface2); }
.tabs { position: fixed; z-index: 50; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.tabs a { display: grid; justify-items: center; gap: 2px; font-size: .75rem; padding: 6px 0; min-height: 48px; align-content: center; }
.tabs a:hover { text-decoration: none; }
body.has-tabs { padding-bottom: 72px; }
@media (min-width: 768px) { .nav { display: flex; } .tabs { display: none; } body.has-tabs { padding-bottom: 0; } }

/* Buttons, chips, bars */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 18px; border-radius: 10px; font-weight: 650; border: 1px solid transparent; cursor: pointer; background: var(--accent); color: var(--accent-fg); text-decoration: none; text-align: center; }
.btn:hover { text-decoration: none; filter: brightness(1.06); }
.btn.alt { background: var(--surface); color: var(--fg); border-color: var(--line); }
.btn.alt:hover { background: var(--surface2); filter: none; }
.btn.ghost { background: none; color: var(--accent); padding-inline: 8px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; filter: none; }
.btn.sm { min-height: 36px; padding: 6px 12px; font-size: .9rem; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: .78rem; font-weight: 650; padding: 3px 9px; border-radius: 99px; background: var(--surface2); color: var(--muted); white-space: nowrap; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.acc { background: var(--accent-soft); color: var(--accent); }
.chip.gold { background: var(--gold-soft); color: var(--gold); }
.bar { height: 8px; border-radius: 99px; background: var(--surface2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .5s ease; }
.bar.good > i { background: var(--good); }
.label { font: 600 .78rem var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

/* Cards and lists */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 10px; align-content: start; min-width: 0; }
a.card { color: inherit; }
a.card:hover { text-decoration: none; border-color: var(--accent); box-shadow: var(--shadow); }
.card.pad0 { padding: 0; gap: 0; }
.list { display: grid; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.item { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 14px 16px; border-top: 1px solid var(--line); color: inherit; min-width: 0; }
.item:first-child { border-top: 0; }

.dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--line); color: var(--accent-fg); font-size: .8rem; flex: none; }
.dot.done { background: var(--good); border-color: var(--good); }
.dot svg { width: 16px; height: 16px; }
.itemtxt { min-width: 0; }
.itemtxt b { display: block; font-weight: 650; overflow-wrap: anywhere; }
.itemtxt span { color: var(--muted); font-size: .88rem; }
.tile { display: grid; gap: 2px; }

.tile span { color: var(--muted); font-size: .85rem; }
.note { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 12px 14px; font-size: .92rem; }
.note.info { background: var(--accent-soft); color: var(--accent); }
.crumbs { font-size: .88rem; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; }
.sect { display: grid; gap: 12px; min-width: 0; }

.hero h1 em { font-style: normal; color: var(--accent); }
.hero p.lead { font-size: 1.15rem; color: var(--muted); max-width: 52ch; }
.demo { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 12px; box-shadow: var(--shadow); }
.demo ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.demo li { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: .92rem; color: var(--muted); }
.loop { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
.loop .card b { font-family: var(--f-display); font-size: 1.15rem; }
.cols { columns: 2 220px; column-gap: 24px; margin: 0; padding-left: 18px; color: var(--muted); }
.footer { border-top: 1px solid var(--line); padding-block: 28px; color: var(--muted); font-size: .9rem; display: grid; gap: 6px; }

/* Lessons and prose */
.prose { display: grid; gap: 14px; max-width: 68ch; }
.prose .lead { font-size: 1.1rem; color: var(--muted); }
.callout { border-radius: 12px; padding: 14px 16px; background: var(--accent-soft); display: grid; gap: 4px; }
.callout.mis { background: var(--bad-soft); }
.callout.sum { background: var(--good-soft); }
.callout b.t { font: 600 .78rem var(--f-mono); letter-spacing: .06em; text-transform: uppercase; }
.prose ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }

.pre { white-space: pre-wrap; overflow-wrap: anywhere; }

/* Quiz and checks */
.opts { display: grid; gap: 10px; }
.opt { display: flex; gap: 12px; text-align: left; width: 100%; padding: 13px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; align-items: flex-start; min-width: 0; overflow-wrap: anywhere; }
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }

.mark { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--line); flex: none; margin-top: 1px; display: grid; place-items: center; font-size: .75rem; font-weight: 700; }
.opt.single .mark { border-radius: 50%; }
.fb { border-radius: 12px; padding: 14px 16px; display: grid; gap: 6px; }
.fb.good { background: var(--good-soft); }
.fb.bad { background: var(--bad-soft); }
.fb b.t { font-family: var(--f-display); }
.scorebig { font: 700 clamp(3rem, 12vw, 5rem)/1 var(--f-display); letter-spacing: -.04em; }
.review { display: grid; gap: 10px; }
.review > div { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 4px; }

/* Simulation */
.chat { display: grid; gap: 12px; }
.msg { max-width: 88%; padding: 12px 14px; border-radius: 14px; display: grid; gap: 2px; overflow-wrap: anywhere; animation: rise .25s ease both; }
.msg small { font: 600 .76rem var(--f-mono); letter-spacing: .04em; opacity: .75; }
.msg.them { background: var(--surface); border: 1px solid var(--line); border-top-left-radius: 4px; }
.msg.me { background: var(--accent); color: var(--accent-fg); margin-left: auto; border-top-right-radius: 4px; }
.msg.sys { max-width: 100%; background: var(--surface2); color: var(--muted); font-size: .92rem; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .msg { animation: none; } .bar > i { transition: none; } }
.meter { display: grid; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }

/* Unlock, modal, toast */
.gate { border: 1.5px solid var(--line); border-radius: 16px; background: var(--surface); padding: 22px; display: grid; gap: 16px; box-shadow: var(--shadow); }
.steps { display: grid; gap: 10px; }
.step { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.step.on { border-color: var(--accent); }
.modal { position: fixed; inset: 0; z-index: 80; background: rgba(8, 11, 18, .72); display: grid; place-items: center; padding: 16px; }
.adbox { width: min(520px, 100%); background: var(--surface); border-radius: 16px; padding: 20px; display: grid; gap: 14px; border: 2px dashed var(--warn); }
.adframe { min-height: 180px; border-radius: 12px; background: var(--surface2); display: grid; place-items: center; text-align: center; padding: 16px; color: var(--muted); }
.toast { position: fixed; z-index: 90; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-weight: 600; font-size: .92rem; max-width: calc(100% - 32px); animation: rise .25s ease both; }
@media (min-width: 768px) { .toast { bottom: 28px; } }
.ach { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }

.dev { font: 700 .76rem var(--f-mono); letter-spacing: .08em; background: var(--warn-soft); color: var(--warn); padding: 3px 8px; border-radius: 6px; justify-self: start; }
details { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--surface); }

       'If you cannot find paying demand after this, adjust the niche before you spend more time learning.'],
      'A freelancer reviews 20 postings for email copywriting and sees 14 asking for welcome sequences for online shops. She writes two sample sequences for imaginary shops and uses them as her first portfolio pieces.',
      ['Niche = client type + problem', 'Read real postings before committing', 'Talk to potential clients', 'Build a sample project to prove ability'],
      ['Staying generic ("I do design")', 'Learning for months without checking demand', 'Choosing a niche with no budget'],
      'Test demand with real postings and real conversations, then build one sample project.',
      C('What is the best first test of demand for a niche?', ['Ask friends if it sounds cool', 'Review real job posts and talk to potential clients', 'Buy an expensive course', 'Wait a year and see'], 1, 'Real postings and real conversations show what clients actually pay for.'))
  ],
  quiz: [
    Q('mc', 1, 'Which set lists the four filters for choosing a skill?', ['Demand, ability, competition, interest', 'Price, colour, speed, size', 'Luck, timing, hype, fame', 'Degree, age, location, gender'], 0, 'Demand, ability, competition and interest are practical, testable filters.', 'The other sets are not useful for judging a skill.'),
    Q('tf', 1, 'A clear niche makes it easier for clients to remember you.', ['True', 'False'], 0, 'A specific client type and problem is easier to remember and refer.', ''),
    Q('mc', 2, 'Which is the best-defined niche?', ['Design', 'Logo design for independent coffee roasters', 'Marketing', 'Writing'], 1, 'It names a skill and a specific client type.', 'The others are broad categories, not niches.'),
    Q('sc', 2, 'Sam is excited by a skill that trends online, but the job posts he finds are rare and mostly unpaid. What does this suggest?', ['Demand may be weak; test further before investing', 'Hype equals demand, so start immediately', 'Take a longer course', 'Offer to work for free'], 0, 'Few paid postings means paid demand may be weak. Check before investing months.', 'Hype and extra courses do not create paid demand.'),
    Q('multi', 3, 'Which actions help test demand before you commit months of learning? (select all)', ['Read 20 real job posts', 'Message a few potential clients about their problems', 'Pick whichever skill has the loudest social media hype', 'Build one small sample project in the niche'], [0, 1, 3], 'Postings, conversations and a sample project all produce real evidence.', 'Social media hype is not evidence of paid demand.')
  ],
  ex: [
    E('Skill scorecard', 'Pick three candidate skills. Score each from 1 to 5 on demand, ability, competition and interest, add the totals, and write a sentence explaining which one you would test first.', ['Scored at least three skills', 'Scored all four filters for each', 'Picked one and wrote a reason', 'Named a possible niche']),
    E('30-day practice plan', 'Plan 30 days of practice for your chosen skill: weekly hours, one sample project, three free learning resources and a finish date.', ['Set a weekly hour target', 'Planned one sample project', 'Listed three free learning resources', 'Defined a finish date'])
  ]
});

SUBS.push({
  id: 'finding-clients', title: 'Finding Clients', lvl: 'Beginner', mins: 45,
  desc: 'Compare marketplaces, direct outreach and referrals, write a headline that explains who you help, and learn to recognise a good-fit client.',
  obj: ['Compare the three main client channels', 'Write a clear profile headline', 'Plan a weekly client-finding routine', 'Recognise unsuitable clients early'],
  lessons: [
    L('Three client channels',
      'Clients come from marketplaces, direct outreach and referrals. Each has a different cost in time, money and trust.',
      ['Marketplaces give fast access to clients who are already looking, but competition is high and fees apply. Direct outreach lets you choose clients and often pay more, but needs a process and some courage. Referrals and communities start slowly and become your most trusted source.',
       'Most freelancers do best with a mix: a few tailored marketplace proposals, a small amount of direct outreach every week, and a habit of asking happy clients for introductions.',
       'Whichever channel you use, the message must show you understood the client, never just list your skills.'],
      'A translator has six hours a week. Two go to tailored marketplace proposals, three to emailing ten small publishers, and one to thanking past clients and asking who else might need help.',
      ['Marketplaces: fast but crowded', 'Outreach: more control, needs a process', 'Referrals: slow to start, highest trust', 'Mix channels and schedule the time'],
      ['Using only one channel', 'Sending identical messages to everyone', 'Waiting for clients to find you'],
      'Use a mix of channels on a schedule, and tailor every message.',
      C('Which channel usually builds trust fastest once you already have happy clients?', ['Referrals from past clients', 'Mass copy-paste messages', 'Waiting for inbound emails', 'Anonymous comments'], 0, 'People trust recommendations from someone they already know.')),
    L('Your headline and good-fit clients',
      'Your profile and your first message must answer one question quickly: who do you help and with what?',
      ['A simple headline formula is "I help [client type] get [result] with [skill]". It is specific, it shows the benefit and it filters out poor-fit work.',
       'A good-fit client has a real budget, a clear problem, responds promptly and respects scope. Warning signs include refusing a deposit, changing scope daily, hiding the budget and pressuring you to start before agreeing terms.',
       'Saying no to poor-fit clients early saves time for the good ones.'],
      '"I help dental clinics turn patient reviews into short social videos" tells a clinic owner exactly what they get. "Hard-working editor available for anything" tells them nothing.',
      ['Use who + result + skill in your headline', 'Good-fit clients have budget, clarity and respect', 'Warning signs appear early; notice them', 'Declining poor fits is part of the job'],
      ['Writing "available for anything"', 'Ignoring early warning signs because you need the money', 'Listing 15 unrelated services'],
      'A specific headline attracts the right clients, and a clear filter protects your time.',
      C('Which headline is strongest?', ['Hard-working freelancer', 'Designer available for anything', 'I help online jewellery shops get clear product photos that sell', 'Best editor ever'], 2, 'It names a client type, a result and a skill.'))
  ],
  quiz: [
    Q('mc', 1, 'What is a main drawback of marketplace platforms?', ['High competition and fees', 'They never allow reviews', 'They have no clients at all', 'They always pay late'], 0, 'Marketplaces are accessible but crowded, and they charge fees.', 'The other options are not true.'),
    Q('tf', 1, 'Sending the same message to 100 businesses without personalising it is an effective outreach method.', ['True', 'False'], 1, 'Generic messages are easy to ignore. Personalised messages get more replies.', ''),
    Q('mc', 2, 'A prospect hides their budget, changes scope daily and refuses a deposit. How good a fit are they?', ['Poor fit: several warning signs', 'Excellent fit', 'A perfect fit for beginners', 'Impossible to say'], 0, 'Each behaviour is a known warning sign.', 'Beginners are not better placed to absorb these problems.'),
    Q('multi', 2, 'Which belong in a strong freelance headline? (select all)', ['Who you help', 'The result you deliver', 'Your skill', 'A list of 15 unrelated services'], [0, 1, 2], 'Client type, result and skill make a headline specific.', 'A long list of unrelated services makes you forgettable.'),
    Q('sc', 3, 'You have 5 hours a week to find clients and no reviews yet. Which plan is most sensible?', ['Spend all 5 hours on one marketplace with generic proposals', 'Split time between tailored proposals, small direct outreach and asking contacts for introductions', 'Wait for clients to find you', 'Spend everything redesigning your logo'], 1, 'A mix of channels with tailored messages spreads risk and builds trust.', 'The other plans rely on one channel, waiting or non-client work.')
  ],
  ex: [
    E('Write your headline', 'Write a headline using "I help [client type] get [result] with [skill]". Then write one alternative version and say which you prefer.', ['Names a client type', 'Names a result', 'Names your skill', 'Under 20 words']),
    E('Build a weekly routine', 'Plan one week of client-finding: hours per channel, the number of messages you will send, a day for follow-ups, and one referral request.', ['Set hours per channel', 'Set a target number of messages', 'Planned a follow-up day', 'Included asking for a referral or testimonial'])
  ]
});

SUBS.push({
  id: 'lead-generation', title: 'Lead Generation', lvl: 'Intermediate', mins: 50,
  desc: 'Build a list of prospects, qualify them, write personalised first messages and follow up without being annoying.',
  obj: ['Build and prioritise a lead list', 'Qualify leads on need, authority, budget and timing', 'Write a personalised first message', 'Plan polite follow-ups'],
  lessons: [
    L('Build and qualify a lead list',
      'A lead is a business that probably has a problem you can solve. A short, qualified list beats a long, random one.',
      ['Find leads in local business listings, social profiles, directories and job posts. Look for visible problems: a slow website, an outdated menu, a post complaining about orders, or a job ad for the thing you do.',
       'Qualify each lead with four questions. Need: is the problem visible? Authority: can I reach someone who can approve it? Budget: can they afford it? Timing: is it relevant now?',
       'Rank leads and contact the strongest first. Ten good leads are worth more than a thousand unchecked names.'],
      'A web designer finds 30 restaurants. Twelve have outdated sites, five have no online ordering, and three recently advertised for a social media manager. She contacts the five without ordering first, because the gap is visible and costing them sales.',
      ['A lead has a visible problem you can solve', 'Qualify on need, authority, budget, timing', 'Rank leads before messaging', 'Keep the list short and researched'],
      ['Building huge unchecked lists', 'Contacting people who cannot decide', 'Treating every lead equally'],
      'Research a short list, qualify it, and contact the best-fit leads first.',
      C('In lead qualification, "authority" means:', ['Whether you can reach someone who can approve the work', 'Whether you have a degree', 'How many followers they have', 'Whether they are famous'], 0, 'You want to talk to a person who can say yes.')),
    L('First messages and follow-up',
      'A good first message is short, specific and easy to answer.',
      ['A simple structure is a specific observation, a relevant result you can deliver, and a low-pressure question. Keep it to about 100 words and never invent credentials.',
       'Follow up once or twice, a few days apart, with something new each time. If there is no reply, stop politely. Respect local anti-spam rules: be honest about who you are and stop when someone asks you to.',
       'Track every message, reply and follow-up date in a simple sheet so nothing slips.'],
      '"Hi Dana, your menu page loads slowly on mobile. I help restaurants speed up their sites so more visitors place orders. Would a short list of the three biggest fixes be useful? No obligation."',
      ['Observation, result, easy question', 'About 100 words', 'One or two follow-ups, then stop', 'Be honest and respect refusals'],
      ['Long essays about yourself', 'False claims or fake flattery', 'Messaging daily until they reply'],
      'Be specific, brief and honest, follow up politely, and track everything.',
      C('What should the first line of an outreach message show?', ['A specific observation about their business', 'A long biography', 'A discount', 'An apology for contacting them'], 0, 'A specific observation proves you looked at their business.'))
  ],
  quiz: [
    Q('mc', 1, 'What is a "lead"?', ['A business or person likely to need your service', 'A paid client', 'A type of invoice', 'A competitor'], 0, 'A lead is a prospect you have reason to believe has the problem you solve.', 'A paid client is already a customer.'),
    Q('tf', 1, 'You should message a prospect every day until they reply.', ['True', 'False'], 1, 'Daily messages become spam. One or two polite follow-ups is enough.', ''),
    Q('sc', 2, 'Which first message is best?', ['"Hello sir, I am a freelancer, please give me work."', '"Hi Dana, your menu page loads slowly on mobile. I help restaurants fix this so more visitors order. Want a short list of fixes?"', '"I am the best web designer in the world, hire me now!"', '"Dear owner, please read my 12-page PDF."'], 1, 'It is specific, relevant and easy to answer.', 'The others are vague, boastful or too long.'),
    Q('multi', 2, 'Which are useful qualification questions? (select all)', ['Do they have a visible problem I can solve?', 'Can they decide or pay for it?', 'Do they have a lot of followers?', 'Is the timing relevant now?'], [0, 1, 3], 'Need, authority/budget and timing predict whether a lead will buy.', 'Follower count alone says little about whether they will hire you.'),
    Q('mc', 3, 'What is a sensible default for follow-ups before you stop?', ['One or two polite follow-ups, then stop', 'Daily until they reply', 'Never follow up', 'Ten in one day'], 0, 'A couple of spaced follow-ups is persistent without being pushy.', 'Daily or bulk follow-ups damage your reputation.')
  ],
  ex: [
    E('Build a 10-lead list', 'Write a list of 10 prospects (real or realistic examples) for your service. For each, note the visible problem and where you found them, then mark your top three.', ['Listed 10 prospects', 'Each has a visible problem', 'Marked the top three', 'Noted where each was found']),
    E('Write a first message', 'Write a first outreach message to your top prospect.', ['Starts with a specific observation', 'States a relevant result', 'Ends with one low-pressure question', 'Under 100 words', 'Makes no false claims'])
  ]
});

SUBS.push({
  id: 'proposals', title: 'Writing Proposals', lvl: 'Intermediate', mins: 50,
  desc: 'Read a brief like a detective, ask the right questions, and write a short proposal with approach, scope, price and a clear next step.',
  obj: ['Find requirements and gaps in a brief', 'Structure a persuasive proposal', 'Avoid generic copy-paste', 'Ask focused questions before quoting'],
  lessons: [
    L('Read the brief first',
      'Most weak proposals fail before they begin, because the freelancer did not read the brief closely.',
      ['Read the brief twice. Underline every requirement, then list what is missing: budget, deadline, audience, examples, success measure. Notice the client\'s worry; it usually sits between the lines.',
       'Some briefs hide an instruction, such as "start your reply with a particular word", to filter out copy-paste applicants. Follow every instruction exactly.',
       'When details are vague, ask two or three focused questions instead of guessing or quoting blind.'],
      'Brief: "Need a logo for my bakery, quick, cheap." Gaps: style, deadline, where it will be used, number of revisions, budget. Good questions: "Where will the logo be used first?" and "Are there logos you like?"',
      ['Underline requirements, list gaps', 'Follow every instruction in the brief', 'Ask two or three focused questions', 'Spot the client\'s real worry'],
      ['Starting with a paragraph about yourself', 'Ignoring instructions', 'Quoting without understanding the scope'],
      'Read closely, find the gaps and ask short, relevant questions.',
      C('What should you do first with a vague brief?', ['Send the lowest price', 'Identify the gaps and ask focused questions', 'Ignore it', 'Write five pages about yourself'], 1, 'Gaps in the brief become questions, which also show care.')),
    L('A structure that works',
      'A proposal is a short plan for solving the client\'s problem, not a CV.',
      ['Open with their goal in their own words. Then outline your approach in three steps, give one piece of relevant proof, state scope, timeline and price, and end with a clear next step.',
       'For a small job, 150 to 250 words is plenty. A price without a defined scope invites disputes later.',
       'Personalise at least the first two lines. Clients can tell when text has been pasted.'],
      '"You need 40 product descriptions for your candle shop in 10 days, in a friendly voice with search in mind. I will review your product notes, send five draft descriptions for approval, then write the remaining 35 with one revision round. Price: $280, half upfront. Shall I send the five-description sample after you confirm scope?"',
      ['Goal, approach, proof, scope and price, next step', '150 to 250 words for small jobs', 'Always define scope with the price', 'Personalise the opening'],
      ['Generic copy-paste text', 'No next step', 'Price without scope'],
      'Show you understood, explain your plan, define scope and price, and ask for the next step.',
      C('Which belongs near the top of a proposal?', ['Your understanding of their problem', 'Your entire CV', 'An apology for bothering them', 'A discount'], 0, 'Starting with their goal shows you read the brief.'))
  ],
  quiz: [
    Q('mc', 1, 'The best opening for a proposal is:', ['A sentence showing you understood their specific goal', 'Hello dear sir or madam', 'A long list of your skills', 'A request to chat elsewhere'], 0, 'Their goal in their own words proves you read the brief.', 'Greetings and skill lists could be sent to anyone.'),
    Q('tf', 1, 'Quoting a price without defining scope is risky.', ['True', 'False'], 0, 'Without scope, the client and you may imagine different amounts of work.', ''),
    Q('sc', 2, 'Brief: "Need a landing page for my yoga studio, include 3 testimonials." Which reply shows it read the brief?', ['"I can make any website."', '"I will build a landing page for your yoga studio including your 3 testimonials, and I have two questions about how class times should appear."', '"I am available now."', '"Hire me, I am cheap."'], 1, 'It repeats the specifics and asks relevant questions.', 'The others do not refer to the brief at all.'),
    Q('multi', 2, 'Which are strong parts of a proposal? (select all)', ['Your approach in clear steps', 'Scope and timeline', 'A relevant example of past work', 'Text copy-pasted to every client'], [0, 1, 2], 'Approach, scope and relevant proof help the client decide.', 'Copy-pasted text is obvious and weak.'),
    Q('mc', 3, 'A brief says "start your reply with the word Banana". Why might the client do this?', ['To check whether applicants read the brief', 'It is a mistake', 'To confuse people', 'There is no reason'], 0, 'Hidden instructions filter out people who skim or copy-paste.', 'It is a deliberate test, not an error.')
  ],
  ex: [
    E('Decode a brief', 'Brief: "We run an online store selling handmade candles. We need product descriptions for 40 items. They must be friendly and search-aware. Deadline in 10 days. Budget is flexible."\n\nList the requirements, three missing details, three questions you would ask, and the client\'s likely worry.', ['Listed the requirements', 'Listed three missing details', 'Wrote three questions', 'Named the client\'s likely worry']),
    E('Draft a proposal', 'Using the candle shop brief, write a proposal of 150 to 250 words.', ['Opens with the client\'s goal', 'Outlines a three-step approach', 'States scope, timeline and price', 'Ends with a clear next step'])
  ]
});

SUBS.push({
  id: 'client-communication', title: 'Client Communication', lvl: 'Beginner', mins: 50,
  desc: 'Write clear updates, confirm decisions in writing, handle scope changes and misunderstandings, and set boundaries without sounding rude.',
  obj: ['Write short, clear client messages', 'Confirm scope and decisions in writing', 'Handle delays honestly', 'Respond to scope changes with options'],
  lessons: [
    L('Clear messages and expectations',
      'Most client conflict is a communication problem, not a skill problem.',
      ['Lead with the point. Put the decision, date or question in the first line, then add detail. Keep one topic per message and use short lists when you offer options.',
       'Set expectations early: how quickly you reply, when you work, how updates are sent and how feedback is given. Confirm important decisions in writing after calls.',
       'When something goes wrong, tell the client early with a new plan. Silence makes small problems look like big ones.'],
      'Before: "Hi, so about the thing, we may need extra time." After: "Hi Lena, the homepage will be ready Thursday instead of Tuesday because the product photos arrived late. Everything else stays on schedule. I will send a preview on Wednesday."',
      ['Lead with the main point', 'One topic per message', 'Confirm decisions in writing', 'Report problems early with a plan'],
      ['Vague updates like "soon"', 'Over-apologising instead of giving a plan', 'Vanishing when things get difficult'],
      'Be specific about dates, reasons and next steps, and communicate problems early.',
      C('Which update is best?', ['"Hi, small delay, probably."', '"The homepage will be ready Thursday (two days late) because the photos arrived late; I will send a preview on Wednesday."', '"Sorry sorry sorry!!"', 'No update until it is finished.'], 1, 'It states the new date, the reason and the next step.')),
    L('Scope changes and boundaries',
      'Scope is what you agreed to deliver. Anything outside it needs a conversation.',
      ['When a client asks for something outside scope, acknowledge the idea, explain that it is additional, and offer options: add it for a price and time, swap it for something in scope, or schedule it for a later phase.',
       'Boundaries protect quality: working hours, reply windows and a fixed number of revision rounds. State them in the agreement, not in the middle of an argument.',
       'Keep a written record of every change, so everyone remembers the same thing.'],
      '"That is a great idea. It is outside the current scope of three pages. I can add it for $90 and two extra days, or include it in a second phase. Which do you prefer?"',
      ['Acknowledge, explain, offer options', 'Put scope and revisions in writing', 'State working hours and reply times', 'Record every change'],
      ['Quietly absorbing extra work (scope creep)', 'Refusing rudely', 'Agreeing verbally with no record'],
      'Treat scope changes as a friendly menu of options, backed by a written record.',
      C('A client asks for a feature outside the agreed scope. What is the best response?', ['Do it free and say nothing', 'Acknowledge it and offer priced options', 'Refuse and stop replying', 'Do it and complain later'], 1, 'Options keep the relationship friendly and protect your time.'))
  ],
  quiz: [
    Q('mc', 1, 'What belongs at the start of a good update message?', ['The main point, date or decision', 'A long apology', 'Your life story', 'Unrelated news'], 0, 'Readers need the key point first.', 'The other options bury the point.'),
    Q('tf', 1, 'It is wise to confirm decisions made on a call in writing afterwards.', ['True', 'False'], 0, 'A short written summary prevents "that is not what we agreed" later.', ''),
    Q('sc', 2, 'In week 3 a client asks for "one small extra page" for free. What is the best reply?', ['"Sure, no problem."', '"Happy to. It is outside the current scope, so I can add it for $X and N days, or schedule it in a second phase. Which suits you?"', '"No. Read the contract."', '"I will do it and rush the rest."'], 1, 'It stays friendly, names the extra clearly and gives options.', 'Saying yes free, refusing rudely or rushing the rest all hurt you.'),
    Q('multi', 2, 'Which help set boundaries? (select all)', ['Stating working hours and reply times', 'Defining revision rounds up front', 'Answering messages at 2 a.m. every night', 'Writing the scope into the agreement'], [0, 1, 3], 'Clear hours, limits and a written scope protect both sides.', 'Always answering at night teaches clients to expect it.'),
    Q('mc', 3, 'You will miss a deadline by two days. When should you tell the client?', ['As soon as you know, with a new date and plan', 'On the deadline day', 'After they ask', 'Never'], 0, 'Early honesty with a plan keeps trust.', 'Delay makes the problem look worse.')
  ],
  ex: [
    E('Rewrite a weak update', 'Rewrite this message so that a client knows what is happening: "Hey, sorry, things are taking longer than expected. I will try to finish soon."', ['States the new date', 'Gives a brief reason', 'Says what stays unchanged', 'Offers a time for the next update']),
    E('Scope change script', 'Write a reply to a client who asks you to add a blog to a website that was agreed as five pages.', ['Acknowledges the request', 'States that it is outside scope', 'Offers at least two options', 'Ends with a question'])
  ]
});

SUBS.push({
  id: 'pricing', title: 'Pricing Your Services', lvl: 'Intermediate', mins: 50,
  desc: 'Work out your minimum rate, compare hourly, fixed and retainer pricing, and quote clearly without undercutting yourself.',
  obj: ['Calculate a minimum hourly rate', 'Choose between hourly, fixed and retainer pricing', 'Build a fixed quote with a buffer', 'Avoid common underpricing traps'],
  lessons: [
    L('Find your price floor',
      'Before you quote anyone, know the lowest rate that keeps your business alive.',
      ['Add your monthly personal needs and business costs, add a tax reserve, then divide by the hours you can actually bill. Billable hours are fewer than hours worked, because finding clients, admin and learning are unpaid.',
       'Your floor is a minimum, not your target. Over time, skill, results and niche let you charge above it.',
       'Tax rules and living costs differ by country, so use your own figures.'],
      'Monthly needs $900 and business costs $100 means $1,000 after tax. With a 10% tax reserve, gross income must be about $1,111. If she can bill 80 hours a month, her floor is about $14 an hour. A 10-hour job therefore should not be quoted below $140.',
      ['Floor = (needs + costs + tax) / billable hours', 'Billable hours are fewer than worked hours', 'The floor is a minimum, not a goal', 'Use your own country\'s costs and tax'],
      ['Using total hours instead of billable hours', 'Forgetting tax and costs', 'Setting prices by copying strangers'],
      'Know your floor and never quote below it.',
      C('If your floor is $14 an hour and a job takes 10 hours, what is the lowest sensible fixed price?', ['$14', '$140', '$100', '$1,400'], 1, '10 hours x $14 is $140, before any buffer.')),
    L('Hourly, fixed, retainer and value',
      'Different jobs suit different pricing models.',
      ['Hourly pricing suits uncertain scope. Fixed pricing suits a clear scope, but you carry the risk of overruns, so add a 20 to 30 percent buffer. A retainer suits ongoing monthly work. Value-based pricing ties the price to the result the client gets.',
       'Offering three packages (basic, standard, premium) helps clients compare and often moves them to the middle option.',
       'When asked for a discount, trade something: scope, timeline or payment terms, instead of cutting price for the same work.'],
      'Three packages: Basic $150, Standard $300, Premium $500, each with a different number of deliverables and revision rounds. Most clients choose Standard.',
      ['Match the model to the job', 'Add a buffer to fixed quotes', 'Offer packages', 'Trade rather than discount'],
      ['Underpricing to win work', 'No buffer for revisions', 'Discounting without getting anything in return'],
      'Choose the model that fits the scope, add a buffer and protect your floor.',
      C('Which model suits ongoing monthly work with predictable needs?', ['Retainer', 'One-off fixed price', 'Free sample', 'Barter'], 0, 'A retainer gives the client a steady service and gives you steady income.'))
  ],
  quiz: [
    Q('tf', 1, 'Your minimum rate should include tax and business costs.', ['True', 'False'], 0, 'If you ignore them, your real earnings are lower than you think.', ''),
    Q('mc', 1, 'Why does a fixed-price quote need a buffer?', ['Projects often run over', 'It makes you look expensive', 'Clients like buffers', 'There is no reason'], 0, 'Revisions and surprises add time that a fixed price must absorb.', 'The other options are not reasons.'),
    Q('sc', 2, 'You estimate 12 hours at $20 an hour and add a 25% buffer. What do you quote?', ['$240', '$300', '$250', '$360'], 1, '12 x $20 is $240; 25% of that is $60; total $300.', '$240 has no buffer.'),
    Q('multi', 2, 'Which are risks of underpricing? (select all)', ['Burnout', 'Attracting price-sensitive clients', 'Difficulty raising rates later', 'Guaranteed repeat work'], [0, 1, 2], 'Low prices create pressure and a low-price client base.', 'Low prices do not guarantee repeat work.'),
    Q('mc', 3, 'A client asks for a 20% discount. What is a sound response?', ['Offer reduced scope or a longer timeline instead of cutting the price for the same work', 'Accept immediately', 'Raise the price secretly', 'Refuse to talk'], 0, 'Trading scope or timeline protects your floor and keeps the relationship.', 'Accepting at once or refusing both lose value.')
  ],
  ex: [
    E('Calculate your floor', 'Work out your minimum hourly rate: monthly needs, business costs, tax reserve and realistic billable hours. Show the calculation.', ['Listed monthly needs', 'Listed business costs', 'Included a tax reserve', 'Used billable hours, not total hours', 'Arrived at an hourly figure']),
    E('Build three packages', 'Design Basic, Standard and Premium packages for your service.', ['Three tiers with different scope', 'Each has clear deliverables', 'Each states the revision count', 'Prices respect your floor'])
  ]
});

SUBS.push({
  id: 'negotiation', title: 'Negotiation', lvl: 'Intermediate', mins: 45,
  desc: 'Prepare your numbers, understand what the client really needs, and trade scope, time and terms instead of simply cutting your price.',
  obj: ['Set an ideal, acceptable and walk-away point', 'Uncover the interests behind a budget', 'Trade scope, time and terms', 'Close agreements in writing'],
  lessons: [
    L('Prepare before you negotiate',
      'Good negotiators decide their numbers before the conversation starts.',
      ['Set three numbers: an ideal price, an acceptable price and a walk-away point (your floor). Know your best alternative if no deal happens, such as other leads or a smaller job.',
       'Look behind positions to interests. "Too expensive" may actually mean a fixed budget, a tight deadline or worry about risk. Ask questions to find out.',
       'Never negotiate against yourself by naming a lower number before the client has responded.'],
      'A client offers $300 for a $500 job because a trade fair opens in four weeks. The interest is a fast, credible launch, not paying less. Options: three pages for $300 now and two later, or five pages for $480 with phased delivery.',
      ['Know ideal, acceptable and walk-away', 'Know your alternative', 'Ask about the interest behind the budget', 'Do not drop your price before they answer'],
      ['Negotiating without a floor', 'Arguing positions instead of interests', 'Conceding early'],
      'Prepare numbers, ask questions and look for interests.',
      C('What is a walk-away point?', ['The lowest deal you would accept', 'Your ideal price', 'The client\'s budget', 'A deadline'], 0, 'Below your walk-away point you are better off with no deal.')),
    L('Trade, do not just discount',
      'Every concession should be matched by something you receive.',
      ['Things you can trade: scope, timeline, payment terms (such as a deposit), the right to show the work, a testimonial or a longer commitment.',

SUBS.push({
  id: 'objections', title: 'Handling Client Objections', lvl: 'Intermediate', mins: 45,
  desc: 'Understand what objections really mean and respond calmly to "too expensive", "I will think about it", free-sample requests and competitor comparisons.',
  obj: ['Use listen, clarify, respond, check', 'Reply to price and trust objections', 'Handle free-work requests professionally', 'Avoid pressure tactics'],

      ['Common objections are about price, trust, timing, authority ("I need to ask my partner") and alternatives. Treat each as a question about risk or value.',
       'Use four steps: listen without interrupting, clarify with a question, respond to the real concern, and check whether it is resolved.',

      ['Arguing', 'Cutting price at the first objection', 'Talking too much'],
      'Ask what the objection means before you answer it.',
      C('What is the first step in handling an objection?', ['Listen and clarify', 'Counter-argue', 'Discount', 'End the chat'], 0, 'Clarifying reveals what the concern really is.')),
    L('Common objections and honest replies',
      'You can be persuasive without pressure or exaggeration.',
      ['"Too expensive": ask about budget, then offer scope options. "Can you do a free sample?": point to portfolio samples or offer a small paid pilot. "I will think about it": ask what is unclear and agree a follow-up date. "My cousin is cheaper": acknowledge it, explain what you include and let them decide.',

      ['Clarify budget, then give options', 'Offer a paid pilot instead of free work', 'Agree a follow-up date', 'Stay honest and calm'],
      ['Using fake urgency', 'Insulting competitors', 'Doing large amounts of free work'],
      'Respond with options and honesty, never pressure.',
      C('A client asks for a free full sample. What is the best approach?', ['Offer relevant portfolio samples or a small paid pilot', 'Do the whole job free', 'Insult them', 'Ghost them'], 0, 'A paid pilot proves your ability without giving away your work.'))
  ],
  quiz: [
    Q('mc', 1, 'What is the best first move when a client says it is too expensive?', ['Ask what they are comparing it with or what budget they had in mind', 'Immediately cut the price', 'Argue', 'Leave'], 0, 'Clarifying shows what the concern really is.', 'The other options skip the clarifying step.'),
    Q('tf', 1, 'An objection can be a sign of interest.', ['True', 'False'], 0, 'People who object are usually weighing the decision seriously.', ''),
    Q('sc', 2, 'Client: "I will think about it." What is the best response?', ['"Fine."', '"Of course. Is there anything I can clarify? I will check back on Thursday."', '"You will lose your slot if you wait!"', '"Final price is half."'], 1, 'It is helpful, uses no pressure and sets a follow-up.', 'Pressure or panic discounts weaken trust.'),

    Q('mc', 3, 'Client: "My cousin can do it for half." Which reply keeps respect?', ['Acknowledge it, explain what is included and how you differ, and let them decide', 'Insult the cousin', 'Match the price immediately', 'Threaten to leave'], 0, 'You stay professional and let the value speak.', 'The others damage trust or your margin.')
  ],
  ex: [
    E('Prepare three objection replies', 'Write replies for: "Too expensive", "Can you do a free sample?" and "I need to think about it".', ['Each reply clarifies first', 'No pressure tactics', 'Offers an option or next step', 'Stays honest']),
    E('Practise the clarify step', 'Write three clarifying questions for a client who says your price is too high.', ['Questions are open, not defensive', 'Ask about budget or alternatives', 'Ask what matters most', 'Tone is calm'])
  ]

SUBS.push({

      ['Pause before replying. Read the message twice, acknowledge the feeling, check the facts, propose a fix with a date, and confirm in writing.',
       'Common patterns: the disappearing client, the micromanager, the endless reviser and the late payer. Each is easier to manage when your process is clear from day one.',

      '"I understand the delay is frustrating. Here is where things stand: four of five pages are done and the last is waiting for the photos requested on the 9th. I will deliver by Friday noon and update you on Wednesday."',
      ['Pause, acknowledge, check facts, propose a fix', 'Confirm the plan in writing', 'Stay factual, not emotional', 'Recognise common difficult patterns'],
      ['Replying instantly when angry', 'Blaming', 'Writing long emotional messages'],
      'A calm, factual message with a plan lowers the temperature.',

      'Process prevents most problems, and a clean exit solves the rest.',
      ['Use a written agreement, a deposit, milestones, a revision limit and clear payment terms. Keep records of changes and approvals.',

       'Consider ending the relationship when there is abuse, repeated non-payment or demands far outside the agreement with no willingness to pay. End professionally and hand over what has been paid for.'],
      '"Thank you for the opportunity. As the agreement states, work continues once the outstanding invoice is settled. Here is a summary of what has been delivered so far."',
      ['Agreements, deposits, milestones and records', 'Friendly then firm payment reminders', 'End calmly if necessary', 'Never insult or publicly shame'],
      ['Working without a deposit', 'No written records', 'Leaving in anger'],
      'Strong process protects you, and a polite exit protects your reputation.',
      C('Which best protects you from non-payment?', ['A written agreement with a deposit and milestones', 'Trust', 'Working faster', 'Lowering your price'], 0, 'Deposits and milestones limit how much work is unpaid at any time.'))
  ],
  quiz: [
    Q('mc', 1, 'What is a good first response to an angry client message?', ['Acknowledge the concern and check the facts', 'Defend yourself immediately', 'Threaten them', 'Ignore it'], 0, 'Acknowledging first lowers tension.', 'The other options escalate.'),
    Q('tf', 1, 'Keeping written records of agreements and changes helps resolve disputes.', ['True', 'False'], 0, 'Records show what was agreed and when.', ''),
    Q('sc', 2, 'A client says "You missed the deadline!" but the deadline moved because their feedback arrived late. What is the best reply?', ['"That is your fault."', '"I understand the frustration. The timeline moved when feedback arrived on the 12th instead of the 8th. Updated plan: preview Friday, final Monday. Does that work?"', '"Sorry, sorry, I will finish tonight."', 'No reply.'], 1, 'It is calm, factual and offers a plan.', 'Blame, panic or silence make it worse.'),
    Q('multi', 2, 'Which may be reasons to end a client relationship? (select all)', ['Repeated non-payment', 'Abusive language', 'They asked one reasonable question', 'Demands far outside the agreement with no willingness to pay'], [0, 1, 3], 'Non-payment, abuse and unpaid scope creep are real reasons.', 'A reasonable question is not a reason to leave.'),
    Q('mc', 3, 'An invoice is three weeks late. What is the most professional sequence?', ['Friendly reminder, firm reminder citing terms, pause further work as the agreement allows', 'Public shaming', 'Ignore it', 'Keep working for free'], 0, 'Escalate politely and follow the agreed terms.', 'Shaming or ignoring creates bigger problems.')
  ],
  ex: [
    E('Calm reply drill', 'A client writes: "This is unacceptable! You promised it by Monday and I still have nothing!" Write a calm, factual reply with a plan.', ['Acknowledges the frustration', 'States facts without blame', 'Gives a specific date', 'Offers a next update time']),
    E('Late payment reminders', 'Write a friendly first reminder and a firmer second reminder for an invoice that is two weeks late.', ['First reminder is polite', 'Second cites the agreed terms', 'States a clear date', 'No threats or insults'])
  ]
});

SUBS.push({

       'Define the number of revision rounds in the agreement. A revision refines what was agreed; a new direction is a change of scope and should be quoted separately.',

      ['Delivering everything at once', 'Unlimited revisions', 'Guessing what vague feedback means'],
      'Stage the work, limit revisions and get approvals in writing.',
      C('Which is a scope change rather than a revision?', ['Changing a colour on an approved page', 'Requesting a completely new layout after approval', 'Fixing a typo', 'Adjusting a margin'], 1, 'A new direction redoes approved work, so it is extra scope.')),

    Q('mc', 1, 'Why ask for written approval at each stage?', ['So earlier decisions are not reopened later', 'To slow the project down', 'To avoid talking', 'It is not needed'], 0, 'Approvals create a record that stages are settled.', 'The other options miss the point.'),
    Q('tf', 1, 'A revision and a scope change are the same thing.', ['True', 'False'], 1, 'A revision refines agreed work; a scope change adds or redoes work.', ''),

    Q('mc', 3, 'When may you release editable source files?', ['After payment, if the agreement says so', 'Before any invoice', 'Never, under any circumstances', 'Only if the client complains'], 0, 'Releasing sources on payment is a common, fair practice when agreed.', 'It depends on the agreement, not on emotion.')

/* Simulation format
   Each sim has 4 stages. Each stage scores one skill (25 points each). Option quality q: 3 best, 2 acceptable, 1 weak, 0 poor.
   Score = sum over stages of 25 * q / 3. Option m changes the client's mood; r is the client's reply; f is the feedback.
   If a stage has `low`, that text is shown when mood < 50 (conditional branching).
   If mood falls to 10 or below, the client ends the engagement and the score is capped at 39. */

SIMS.push({
  id: 'difficult', subs: ['difficult-clients'], title: 'The Overdue Website', lvl: 'Advanced', mins: 6,
  who: 'Marco', role: 'Bakery owner', meter: 'Client mood', mood: 45,
  brief: 'You are building a five-page website for Marco\'s bakery. The deadline was yesterday, one page is waiting on photos Marco has not sent, and he is unhappy.',
  quit: 'Marco ends the contract and asks for a refund. The relationship has broken down.',
  end: { good: 'Marco approves the site, pays on time and says he will recommend you to another shop owner.', mid: 'The site launches and Marco pays, but he stays cautious and does not offer more work.', bad: 'Marco pays late and leaves a lukewarm review. The project cost you more energy than it earned.' },
  stages: [
    { sk: 'Professionalism', say: 'I expected the website to be completed yesterday. Why is it still unfinished?', low: 'I expected the website to be completed yesterday. Why is it still unfinished?', o: [
      O('I understand why that is frustrating, Marco. Four of five pages are done; the menu page is waiting for the photos I requested on the 9th. Let me give you a clear plan.', 3, 15, 'Okay. That helps. I forgot about the photos. What is the plan?', 'You acknowledged the feeling, stated facts without blaming and offered a plan.'),
      O('The delay is not my fault. You sent the photos late.', 1, -15, 'Do not blame me! I am paying you for this.', 'The facts may be on your side, but blame escalates. Acknowledge first, then explain.'),
      O('Sorry, sorry! I will try to finish it as soon as possible.', 2, -5, 'As soon as possible is not a date. Give me a date.', 'Apologising without facts or a date forces the client to ask for the key information.'),
      O('I have been working really hard. You do not appreciate it.', 0, -25, 'That is not my problem. I want results.', 'Defending your effort shifts the focus to you. The client cares about the outcome.')
    ] },
    { sk: 'Communication', say: 'Okay, so when will the full site be live? I have a promotion starting Monday.', low: 'I am losing patience. A promotion starts Monday and I cannot send people to half a website. When exactly?', o: [
      O('The final site can be ready Friday at noon, leaving the weekend for you to check it. I will send a preview on Wednesday so we can catch changes early.', 3, 10, 'Good. Friday noon, preview Wednesday. That works.', 'A specific date, a buffer and a preview give the client confidence.'),
      O('Friday. I will update you tomorrow.', 2, 3, 'Fine. Friday then.', 'A date is good. A mid-point preview would have made the plan stronger.'),
      O('Probably Friday or so, depends.', 1, -8, '"Or so" is not a plan.', 'Hedging language makes the client anxious.'),
      O('As soon as I can, maybe the weekend.', 0, -15, 'The weekend is after my promotion!', 'A vague date that misses the client\'s deadline damages trust.')
    ] },
    { sk: 'Problem-solving', say: 'Also, I want to add an online ordering page. It should be quick, no?', low: 'And I need online ordering too. It is just one page, so do not make this complicated.', o: [
      O('Online ordering is a great idea for the promotion. It is outside the five pages we agreed, so I suggest launching the current site Friday and adding ordering as a second phase with its own estimate. Shall I send that tomorrow?', 3, 8, 'Fine, launch first, then ordering.', 'You welcomed the idea, protected scope and offered a sensible plan.'),
      O('That will cost $200 extra.', 2, -5, 'Extra? You did not say that before.', 'Stating a price is right, but with no context or options it feels abrupt.'),
      O('Sure, I will add it for the same price.', 1, 10, 'Wonderful, thank you!', 'The client is happy now, but you absorbed unpaid work and set a precedent.'),
      O('No, that is not in the contract.', 0, -15, 'Wow. Okay then.', 'A flat refusal with no options damages the relationship.')
    ] },
    { sk: 'Decision-making', say: 'It looks good. Send me the invoice whenever you are ready.', low: 'Fine, it is finally here. I am still not happy about the delay, but send the invoice.', o: [
      O('Thank you, Marco. The invoice is attached, due in seven days as agreed, with a short handover guide. I will send the editable files once it is paid. If you are happy, I would appreciate a short testimonial.', 3, 5, 'Will do. Thanks.', 'You protected payment, delivered professionally and asked for a testimonial.'),
      O('Here is the invoice and the files. Pay when you can.', 2, 0, 'Okay.', 'Good intent, but no due date and releasing everything before payment adds risk.'),
      O('Here are all the files. We can sort out payment later.', 1, 0, 'Thanks, I will check my budget.', 'Delivering everything with no payment terms removes your leverage.'),
      O('I want an apology for how you spoke to me earlier, and then I will invoice you.', 0, -20, 'An apology? Forget it.', 'Making the invoice depend on an apology turns a business matter into a fight.')
    ] }
  ]
});

SIMS.push({

SIMS.push({

<script>
/* ===== ENGINE: state, scoring, ads, helpers (no content here) ===== */
(function () {
'use strict';
const BRAND = 'Skillyard';
const PASS = 70;
const KEY = 'skillyard.progress.v1';
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const sub = id => SUBS.find(s => s.id === id);
const simById = id => SIMS.find(m => m.id === id);
const simsFor = id => SIMS.filter(m => m.subs.indexOf(id) >= 0);

/* Icons */
const IC = {
  learn: '<path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H20v14H5.5A1.5 1.5 0 0 0 4 19.5z"/><path d="M4 19.5A1.5 1.5 0 0 0 5.5 21H20"/>',
  practice: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/>',

  lock: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/>',
  moon: '<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>',
  flame: '<path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/>',
  star: '<path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.5 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/>',

  chat: '<path d="M4 5h16v11H9l-5 4z"/>',
  pen: '<path d="M4 20l4-1L19 8l-3-3L5 16z"/>',
  quiz: '<path d="M9 9a3 3 0 1 1 4.5 2.6c-1 .6-1.5 1.2-1.5 2.4"/><circle cx="12" cy="18" r=".6"/><circle cx="12" cy="12" r="9"/>'
};
const ic = n => '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">' + (IC[n] || '') + '</svg>';

/* Storage with in-memory fallback */
let storageOK = true;
const blank = () => ({ v: 1, name: '', theme: 'system', xp: 0, streak: { n: 0, last: '' }, lessons: {}, ex: {}, quiz: {}, sim: {}, unlock: {}, adp: {}, ach: {}, hist: [], improved: false });
function load() {
  try {
    localStorage.setItem(KEY + '.t', '1'); localStorage.removeItem(KEY + '.t');
    const r = localStorage.getItem(KEY);
    if (r) return Object.assign(blank(), JSON.parse(r));
  } catch (e) { storageOK = false; }
  return blank();
}
let S = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { storageOK = false; } }

/* Dates, streaks, levels */
const ymd = off => { const d = new Date(); d.setDate(d.getDate() + (off || 0)); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
function touch() { const t = ymd(0); if (S.streak.last === t) return; S.streak.n = S.streak.last === ymd(-1) ? S.streak.n + 1 : 1; S.streak.last = t; }
const curStreak = () => (S.streak.last === ymd(0) || S.streak.last === ymd(-1)) ? S.streak.n : 0;
const level = xp => 1 + Math.floor(Math.sqrt(xp / 60));
const lvlFloor = L => 60 * (L - 1) * (L - 1);
const lvlNext = L => 60 * L * L;
const fmtDate = t => new Date(t).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });

/* Toast */
let toastT;
function toast(msg) {
  let el = $('#toast');
  if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
  el.textContent = msg; el.style.display = 'block';
  clearTimeout(toastT); toastT = setTimeout(() => { el.style.display = 'none'; }, 2800);
}

/* Progress */
const isUnlocked = id => !!S.unlock[id];
/* Access rule: lesson 1 of every section is free. Everything else in a section opens once the section is unlocked.
   Unlock is optional and currently granted by the ad provider; other methods can be added by setting S.unlock[id]. */
const FREE_LESSONS = 1;
const canOpenLesson = (sid, i) => isUnlocked(sid) || i < FREE_LESSONS;
function subStats(s) {
  const lDone = s.lessons.filter((_, i) => S.lessons[s.id + ':' + i]).length;
  const eDone = s.ex.filter((_, i) => S.ex[s.id + ':' + i] && S.ex[s.id + ':' + i].done).length;
  const qDone = S.quiz[s.id] && S.quiz[s.id].passed ? 1 : 0;
  const sims = simsFor(s.id);
  const sDone = sims.filter(m => S.sim[m.id] && S.sim[m.id].attempts.length).length;
  const total = s.lessons.length + s.ex.length + 1 + sims.length;
  const done = lDone + eDone + qDone + sDone;
  return { lDone, eDone, qDone, sDone, total, done, pct: Math.round(done / total * 100), complete: done === total };
}
function nextStep() {
  for (const s of SUBS) {
    if (!isUnlocked(s.id)) { if (!S.lessons[s.id + ':0']) return { s, label: 'Lesson 1: ' + s.lessons[0].t, href: '#lesson-' + s.id + '-0' }; continue; }
    const st = subStats(s); if (st.complete) continue;
    const li = s.lessons.findIndex((_, i) => !S.lessons[s.id + ':' + i]);
    if (li >= 0) return { s, label: 'Lesson ' + (li + 1) + ': ' + s.lessons[li].t, href: '#lesson-' + s.id + '-' + li };
    if (!(S.quiz[s.id] && S.quiz[s.id].passed)) return { s, label: 'Quiz: ' + s.title, href: '#quiz-' + s.id };
    const ei = s.ex.findIndex((_, i) => !(S.ex[s.id + ':' + i] && S.ex[s.id + ':' + i].done));
    if (ei >= 0) return { s, label: 'Exercise: ' + s.ex[ei].t, href: '#ex-' + s.id + '-' + ei };
    const m = simsFor(s.id).find(x => !(S.sim[x.id] && S.sim[x.id].attempts.length));
    if (m) return { s, label: 'Simulation: ' + m.title, href: '#play-' + m.id };
  }
  const first = SUBS.find(s => !isUnlocked(s.id));
  return first ? { s: first, label: 'Unlock the rest of ' + first.title, href: '#sub-' + first.id, unlock: true } : null;
}

/* XP, history, achievements */
function award(n, label) { if (n <= 0) return; S.xp += n; touch(); toast('+' + n + ' XP  ' + label); }
function log(type, label, score) { S.hist.unshift({ t: Date.now(), type, label, score: score == null ? null : score }); S.hist = S.hist.slice(0, 60); }
const sectionsDone = () => Object.keys(S.ach).filter(k => k.indexOf('sub:') === 0).length;
const ACH = [
  { id: 'first-lesson', n: 'First step', d: 'Complete your first lesson', i: 'learn', t: s => Object.keys(s.lessons).length >= 1 },
  { id: 'lessons-10', n: 'Ten lessons', d: 'Complete ten lessons', i: 'learn', t: s => Object.keys(s.lessons).length >= 10 },
  { id: 'quiz-pass', n: 'Quiz passed', d: 'Pass a section quiz', i: 'quiz', t: s => Object.values(s.quiz).some(q => q.passed) },
  { id: 'quiz-perfect', n: 'Perfect score', d: 'Score 100% on a quiz', i: 'star', t: s => Object.values(s.quiz).some(q => q.best === 100) },
  { id: 'sim-first', n: 'Into the field', d: 'Finish your first simulation', i: 'chat', t: s => Object.values(s.sim).some(m => m.attempts.length) },
  { id: 'sim-strong', n: 'Strong practice', d: 'Score 75 or more in a simulation', i: 'chat', t: s => Object.values(s.sim).some(m => m.best >= 75) },
  { id: 'sim-excellent', n: 'Excellent practice', d: 'Score 90 or more in a simulation', i: 'star', t: s => Object.values(s.sim).some(m => m.best >= 90) },
  { id: 'improver', n: 'Getting better', d: 'Beat your previous score on a retry', i: 'progress', t: s => !!s.improved },
  { id: 'streak-3', n: 'Three-day streak', d: 'Learn on three days in a row', i: 'flame', t: () => curStreak() >= 3 },
  { id: 'streak-7', n: 'Seven-day streak', d: 'Learn on seven days in a row', i: 'flame', t: () => curStreak() >= 7 },
  { id: 'section', n: 'Section complete', d: 'Finish every item in a section', i: 'check', t: () => sectionsDone() >= 1 }
];
function checkAch() { ACH.forEach(a => { if (!S.ach[a.id] && a.t(S)) { S.ach[a.id] = Date.now(); toast('Achievement unlocked: ' + a.n); } }); }
function checkSub(id) {
  const s = sub(id); if (!s) return;
  if (subStats(s).complete && !S.ach['sub:' + id]) { S.ach['sub:' + id] = Date.now(); award(100, 'Section complete'); log('complete', s.title); }
}
function afterAction(subIds) { (subIds || []).forEach(checkSub); checkAch(); save(); }

/* Ratings (fixed score ranges) */
const RATINGS = [[90, 'Excellent', 'good'], [75, 'Strong', 'good'], [60, 'Competent', 'acc'], [40, 'Developing', 'warn'], [0, 'Needs Improvement', 'warn']];
const rating = s => RATINGS.find(r => s >= r[0]);

/* ===== Ad provider layer =====
   The unlock flow talks only to this interface. To go live, register a real provider that implements show(ctx)
   and calls ctx.onComplete() ONLY when the ad network confirms the ad finished (or the reward was granted),
   ctx.onDismiss() if the viewer closes it early, and ctx.onError(msg) if no ad could be served.
   Never call onComplete from a timer in production. The development placeholder does so on purpose and says so. */
const DevPlaceholder = {
  id: 'dev-placeholder', real: false, name: 'Development placeholder',
  show(ctx) {
    let left = 5, timer = null, done = false;
    const host = ctx.host;
    host.innerHTML = '<span class="dev">DEVELOPMENT PLACEHOLDER</span>' +
      '<h3>Ad ' + ctx.index + ' of ' + ctx.total + '</h3>' +
      '<div class="adframe"><p>No real advertisement is running here. This panel stands in for an ad network player, shows nothing from any advertiser and produces no impressions or revenue.</p></div>' +
      '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0"><i id="adbar" style="width:0%"></i></div>' +
      '<p class="muted" id="adtxt">Placeholder finishes in 5 seconds</p>' +
      '<div class="row between"><button class="btn alt" data-a="adclose">Close</button><button class="btn" id="adok" data-a="adok" disabled>Continue</button></div>';
    const bar = $('#adbar', host), txt = $('#adtxt', host), ok = $('#adok', host);
    timer = setInterval(() => {
      left -= 0.1;
      if (left <= 0) { clearInterval(timer); done = true; bar.style.width = '100%'; txt.textContent = 'Placeholder finished. Press Continue.'; ok.disabled = false; ok.focus(); }
      else { bar.style.width = ((5 - left) / 5 * 100) + '%'; txt.textContent = 'Placeholder finishes in ' + Math.ceil(left) + ' seconds'; }
    }, 100);
    ctx._ok = () => { if (done) ctx.onComplete(); };
    return () => clearInterval(timer);
  }
};
let AdProvider = DevPlaceholder;
let adCancel = null, adCtx = null;
function closeModal() { if (adCancel) { adCancel(); adCancel = null; } adCtx = null; const m = $('#modal'); if (m) m.remove(); }
function watchAd(sid) {
  const s = sub(sid); if (!s || isUnlocked(sid)) return;

  };

}

/* ---------- landing ---------- */
function pageWelcome() {
  const demo = simById('difficult');
  const st = demo.stages[0];
  const first = st.o.slice(0, 3).map(o => '<li>' + esc(o.t.length > 110 ? o.t.slice(0, 107) + '...' : o.t) + '</li>').join('');

    '<section class="hero"><div class="stack" style="gap:20px"><span class="label">Free skills practice for people who earn on their own</span>' +

    '<div class="demo" aria-label="Example simulation turn"><div class="row between"><span class="label">Simulation example</span><span class="chip">Client mood: tense</span></div>' +
    '<div class="msg them"><small>' + esc(demo.who.toUpperCase()) + ' · ' + esc(demo.role.toUpperCase()) + '</small>' + esc(st.say) + '</div>' +
    '<p class="label">You choose how to reply</p><ul>' + first + '</ul><a class="btn alt" href="#sub-difficult-clients">Try this simulation</a></div></section>' +
    '<section class="sect" id="how"><div class="stack"><span class="label">The loop</span><h2>Learn, practise, test, improve</h2></div><div class="loop">' +
    '<div class="card"><b>Learn</b><p class="muted">Short lessons with a realistic example, key points and the mistakes beginners make.</p></div>' +
    '<div class="card"><b>Practise</b><p class="muted">Written exercises with a checklist, and simulations where your choices change how the client responds.</p></div>' +
    '<div class="card"><b>Test</b><p class="muted">Quizzes with instant explanations, including why each wrong option misses.</p></div>' +
    '<div class="card"><b>Improve</b><p class="muted">Retry any simulation, keep your best score and see how your attempts change.</p></div></div></section>' +
    '<section class="sect"><div class="stack"><span class="label">Categories</span><h2>Freelancing is open. More are planned.</h2></div><div class="grid two">' +
    '<a class="card" href="#cat-freelancing"><div class="row between"><h3>Freelancing</h3><span class="chip good">Open now</span></div><p class="muted">' + subs + ' sections from fundamentals to client retention, with ' + SIMS.length + ' simulations.</p></a>' +
    '<div class="card"><div class="row between"><h3>Online business, content, marketing, technology, finance and more</h3><span class="chip">Planned</span></div><p class="muted">The content system is built to add categories without changing the app. Nothing is shown as available until it is written.</p></div></div></section>' +

function qzStart(s) {

function qzCheck() {
  const z = UI.qz, q = z.list[z.i].q;
  const ans = (Array.isArray(q.a) ? q.a.slice() : [q.a]).sort(), sel = z.sel.slice().sort();
  const ok = ans.length === sel.length && ans.every((v, k) => v === sel[k]);
  z.checked = true; z.res[z.i] = { ok, sel: z.sel.slice() };
}
function qzFinish() {
  const z = UI.qz, s = sub(z.sid);
  const correct = z.res.filter(r => r.ok).length, score = Math.round(correct / z.list.length * 100), pass = score >= PASS;
  const rec = S.quiz[s.id] || { best: 0, passed: false, attempts: [] };
  const first = !rec.attempts.length; let xp = 0;
  if (first) xp += pass ? 40 : 10; else if (pass && !rec.passed) xp += 30;
  if (!first && score > rec.best) { xp += Math.round((score - rec.best) / 2); S.improved = true; }
  z.prevBest = rec.best; z.first = first;
  rec.best = Math.max(rec.best, score); rec.passed = rec.passed || pass; rec.attempts.push({ s: score, t: Date.now() }); rec.attempts = rec.attempts.slice(-20);
  S.quiz[s.id] = rec; z.score = score; z.pass = pass; z.correct = correct; z.phase = 'result';

}

/* ---------- simulations ---------- */
const MOODS = ['Frustrated', 'Tense', 'Neutral', 'Cooperative', 'Delighted'];
const IMPRESS = ['Doubtful', 'Cautious', 'Neutral', 'Interested', 'Impressed'];
const moodLabel = (m, v) => (m.meter === 'Interviewer impression' ? IMPRESS : MOODS)[v < 25 ? 0 : v < 45 ? 1 : v < 65 ? 2 : v < 85 ? 3 : 4];
const simSkills = m => m.skills || m.stages.map(s => s.sk);
const QTAG = ['Poor', 'Weak', 'Acceptable', 'Best'];
function simStart(m) { UI.sm = { id: m.id, phase: 'play', stage: 0, mood: m.mood, steps: [], orders: [], done: false, quit: false, result: null }; }
function simPick(oi) {
  const m = simById(UI.sm.id), z = UI.sm, st = m.stages[z.stage], o = st.o[oi];
  const say = (st.low && z.mood < 50) ? st.low : st.say;
  z.steps.push({ sk: st.sk, say, o, best: st.o.reduce((a, b) => b.q > a.q ? b : a) });
  if (m.meter) z.mood = clamp(z.mood + o.m, 0, 100);
  z.stage++;
  if (m.meter && z.mood <= 10 && z.stage < m.stages.length) z.quit = true;
  if (z.quit || z.stage >= m.stages.length) { z.done = true; simFinish(m, z); }
}
function simFinish(m, z) {
  const per = m.stages.map((st, i) => z.steps[i] ? 25 * z.steps[i].o.q / 3 : 0);
  let score = Math.round(per.reduce((a, b) => a + b, 0));
  if (z.quit) score = Math.min(score, 39);
  const key = m.meter ? (z.mood >= 65 ? 'good' : z.mood >= 35 ? 'mid' : 'bad') : (score >= 75 ? 'good' : score >= 50 ? 'mid' : 'bad');
  const prev = S.sim[m.id] || { best: 0, attempts: [] }, first = !prev.attempts.length; let xp = 0;
  if (first) xp = 30 + Math.round(score / 5); else if (score > prev.best) { xp = Math.round((score - prev.best) / 2); S.improved = true; }
  z.result = { score, per, key, prevBest: prev.best, first, newBest: !first && score > prev.best };
  prev.best = Math.max(prev.best, score); prev.attempts.push({ s: score, t: Date.now() }); prev.attempts = prev.attempts.slice(-20); S.sim[m.id] = prev;
  log('sim', m.title, score); award(xp, 'Simulation'); afterAction(m.subs);
}
function simIntro(m) {
  const rec = S.sim[m.id], skills = simSkills(m);
  const bands = RATINGS.slice().reverse().map((r, i, a) => r[1] + ' ' + r[0] + (i < a.length - 1 ? '-' + (a[i + 1][0] - 1) : '-100')).join(' · ');
  return '<section class="sect"><div class="crumbs"><a href="#sub-' + m.subs[0] + '">' + esc(sub(m.subs[0]).title) + '</a><span>/</span><span>Simulation</span></div>' +

function simChat(m, z) {

    parts.push('<div class="msg them"><small>' + esc(m.who.toUpperCase()) + '</small>' + esc(s.say) + '</div>');
    parts.push('<div class="msg me"><small>YOU</small>' + esc(s.o.t) + '</div>');
    if (m.meter && s.o.r) parts.push('<div class="msg them"><small>' + esc(m.who.toUpperCase()) + '</small>' + esc(s.o.r) + '</div>');
  });
  let tail = '';
  if (z.quit) tail = '<div class="msg sys" id="last">' + esc(m.quit) + '</div>';
  else if (!z.done) {
    const st = m.stages[z.stage], say = (st.low && z.mood < 50) ? st.low : st.say;
    if (!z.orders[z.stage]) z.orders[z.stage] = shuffle(st.o.map((_, i) => i));
    tail = '<div class="msg them" id="last"><small>' + esc(m.who.toUpperCase()) + (m.meter ? '' : ' · DECISION') + '</small>' + esc(say) + '</div>' +
      '<p class="label">Choose your response (decision ' + (z.stage + 1) + ' of ' + m.stages.length + ')</p><div class="opts">' +
      z.orders[z.stage].map(i => '<button class="opt single" data-a="spick" data-i="' + i + '"><span class="mark"></span><span>' + esc(st.o[i].t) + '</span></button>').join('') + '</div>';
  } else tail = '<div id="last"></div>';

  return '<section class="sect"><div class="crumbs"><a href="#sub-' + m.subs[0] + '">' + esc(sub(m.subs[0]).title) + '</a><span>/</span><span>' + esc(m.title) + '</span></div>' + meter +
    '<div class="chat" aria-live="polite">' + parts.join('') + tail + '</div>' + (z.done ? '<div><button class="btn" data-a="sresult">See my results</button></div>' : '') + '</section>';
}
function simResult(m, z) {

  const strong = skills.filter((k, i) => r.per[i] >= 20), weak = skills.filter((k, i) => r.per[i] < 15);
  const adv = k => (m.adv && m.adv[k]) || ({ Professionalism: 'Stay calm and factual, and acknowledge the other person\'s concern before you explain.', Communication: 'Be specific with dates, numbers and next steps, and end with a clear question.', 'Problem-solving': 'Offer options with trade-offs instead of a flat yes or no.', 'Decision-making': 'Protect yourself with written terms, deposits and approvals before you commit.' }[k]);
